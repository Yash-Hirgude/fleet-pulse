services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      - PORT=4000
      - SECONDARY_PORT=4001
      - NODE_ENV=production
      # Chaos switches (0 = disabled; set to 0.1-0.5 to inject faults)
      - CHAOS_DROP_RATE=0
      - CHAOS_DUPLICATE_RATE=0
      - CHAOS_OUT_OF_ORDER_RATE=0
      - CHAOS_DELAY_MS=0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: unless-stopped